services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
    volumes:
      - ${DATA_ROOT}:/data
    ports:
      - 7359:7359/udp
      - 1900:1900/udp
    restart: unless-stopped
    networks:
      - proxy
    devices:
      - /dev/dri:/dev/dri #Use for Intel QuickSync
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.entrypoints=web,websecure
      - traefik.http.routers.jellyfin.rule=(Host(`${JELLYFIN_HOSTNAME}`))
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
      - WEBUI_PORT=8080
    volumes:
      - ${DATA_ROOT}:/data 
    ports:
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbittorrent.entrypoints=web,websecure
      - traefik.http.routers.qbittorrent.rule=(Host(`${QBITTORRENT_HOSTNAME}`))
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8080
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.entrypoints=web,websecure
      - traefik.http.routers.prowlarr.rule=(Host(`${PROWLARR_HOSTNAME}`))
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
    volumes:
       - ${DATA_ROOT}:/data 
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.entrypoints=web,websecure
      - traefik.http.routers.radarr.rule=(Host(`${RADARR_HOSTNAME}`))
      - traefik.http.services.radarr.loadbalancer.server.port=7878
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
    volumes:
       - ${DATA_ROOT}:/data 
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.entrypoints=web,websecure
      - traefik.http.routers.sonarr.rule=(Host(`${SONARR_HOSTNAME}`))
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=INFO
      - TZ=${TIMEZONE}
    volumes:
      - ${DATA_ROOT}/configs/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.seerr.entrypoints=web,websecure
      - traefik.http.routers.seerr.rule=(Host(`${SEERR_HOSTNAME}`))
      - traefik.http.services.seerr.loadbalancer.server.port=5055
networks:
  proxy:
    external: true