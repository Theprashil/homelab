services:
  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    container_name: duplicati
    restart: unless-stopped
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
    volumes:
      - ${CONFIG_ROOT}/duplicati:/config
      - ${BACKUP_ROOT}:/backups
      - ${CONFIG_ROOT}:/source
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.duplicati.entrypoints=web,websecure
      - traefik.http.routers.duplicati.rule=(Host(`${DUPLICATI_HOSTNAME}`))
      - traefik.http.services.duplicati.loadbalancer.server.port=8200
networks:
  proxy:
    external: true
